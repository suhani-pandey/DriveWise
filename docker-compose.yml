services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: drivewise-postgres
    environment:
      POSTGRES_USER: drivewise
      POSTGRES_PASSWORD: drivewise
      POSTGRES_DB: drivewise
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
